{{define "content"}}
<h1>{{if .Edit}}Edit{{else}}New{{end}} cron job</h1>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
<form method="post" action="{{.Action}}">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" value="{{.Job.Name}}" required>

  <label for="schedule">Schedule (cron expression)</label>
  <input type="text" id="schedule" name="schedule" value="{{.Job.Schedule}}" placeholder="0 3 * * *" required>

  <label for="script">Script</label>
  <textarea id="script" name="script" required>{{.Job.Script}}</textarea>

  <label style="display:flex;align-items:center;gap:0.5rem">
    <input type="checkbox" name="enabled" style="width:auto" {{if .Job.Enabled}}checked{{end}}> Enabled
  </label>

  <p><button type="submit">Save</button> <a href="/cron">Cancel</a></p>
</form>
{{end}}
