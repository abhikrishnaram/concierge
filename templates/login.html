{{define "content"}}
<h1>Concierge</h1>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
<form method="post" action="/login">
  <label for="code">6-digit code</label>
  <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autofocus required autocomplete="one-time-code">
  <p><button type="submit">Sign in</button></p>
</form>
{{end}}
