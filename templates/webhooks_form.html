{{define "content"}}
<h1>{{if .Edit}}Edit{{else}}New{{end}} webhook route</h1>
{{if .Error}}<p class="err">{{.Error}}</p>{{end}}
<form method="post" action="{{.Action}}">
  <label for="path">Path</label>
  <input type="text" id="path" name="path" value="{{.Route.Path}}" placeholder="deploy-api" required{{if .Edit}} readonly{{end}}>
  <p class="muted">Triggered at <code>POST /hooks/&lt;path&gt;</code></p>

  <label for="name">Name</label>
  <input type="text" id="name" name="name" value="{{.Route.Name}}" required>

  <label for="script">Script</label>
  <textarea id="script" name="script" required>{{.Route.Script}}</textarea>

  {{if .Edit}}
  <label for="trigger_url">Request URL</label>
  <input type="text" id="trigger_url" class="mono" value="{{.TriggerURL}}" readonly onclick="this.select()">

  <label for="token">Token</label>
  <input type="text" id="token" class="mono" value="{{.Route.Token}}" readonly onclick="this.select()">
  <p class="muted">Send as the <code>X-Deploy-Token</code> header on the incoming request.</p>

  <label for="curl_cmd">curl</label>
  <input type="text" id="curl_cmd" class="mono" value="{{.CurlCmd}}" readonly onclick="this.select()">
  <p class="muted">Click a field to select it, then copy.</p>
  {{end}}

  <p><button type="submit">Save</button> <a href="/webhooks">Cancel</a></p>
</form>
{{end}}
